<style>
  *{box-sizing:border-box;margin:0}
  html{background:#0e0e0e}
  body{background:#0e0e0e;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  /* the long scroll is a 1440px desktop artboard: keep its proportions and only scale it to the window, never reflow it */
  .scroll{width:min(1312px,100% - 64px);margin:96px auto 120px;border-radius:24px;overflow:hidden;line-height:0}
  .scroll img{display:block;width:100%;height:auto}
  .back{position:fixed;top:20px;left:50%;translate:-50% 0;z-index:5;display:flex;align-items:center;gap:8px;
    padding:10px 18px 10px 14px;border-radius:999px;background:#f4f1ec;color:#141416;font:500 14px/1 Inter,sans-serif;text-decoration:none;
    box-shadow:0 6px 20px rgba(0,0,0,.4);transition:transform .2s}
  .back:hover{transform:translateY(-1px)}
  .back svg{width:16px;height:16px}
  @media(max-width:700px){ .scroll{width:calc(100% - 32px);margin-top:76px;border-radius:14px} }
  /* "View Prototype" pill in the hero: an invisible hotspot over the drawn button (artboard 117–386 × 577–636 of 1440 × 34520) */
  .scroll{position:relative}
  .proto-hit{position:absolute;left:calc(112 / 1440 * 100%);top:calc(572 / 34520 * 100%);width:calc(280 / 1440 * 100%);height:calc(70 / 34520 * 100%);
    border:0;padding:0;background:transparent;border-radius:999px;cursor:pointer;transition:box-shadow .2s,background .2s}
  .proto-hit:hover,.proto-hit:focus-visible{background:rgba(255,255,255,.06);box-shadow:0 0 0 2px rgba(255,255,255,.55);outline:none}
  .proto{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(8,8,8,.86);backdrop-filter:blur(6px);
    opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}
  .proto.on{opacity:1;visibility:visible}
  .proto video{max-height:88vh;max-width:92vw;border-radius:22px;background:#000;box-shadow:0 20px 60px rgba(0,0,0,.6)}
  .proto-x{position:absolute;top:20px;right:20px;width:44px;height:44px;border:0;border-radius:50%;background:#f4f1ec;color:#141416;cursor:pointer;display:grid;place-items:center}
  .proto-x svg{width:18px;height:18px}
</style>
</head>

  <video src="licious/prototype.mp4" controls playsinline preload="none"></video>
</div>
<script>
  const box=document.querySelector('.proto'), vid=box.querySelector('video');
  const open=()=>{ box.classList.add('on'); vid.currentTime=0; vid.play().catch(()=>{}); };
  const shut=()=>{ box.classList.remove('on'); vid.pause(); };
  document.querySelector('.proto-hit').addEventListener('click',open);
  box.querySelector('.proto-x').addEventListener('click',shut);
  box.addEventListener('click',e=>{ if(e.target===box) shut(); });
  addEventListener('keydown',e=>{ if(e.key==='Escape') shut(); });
</script>
